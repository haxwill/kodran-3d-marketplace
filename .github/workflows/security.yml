name: DevSecOps & Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sast-and-dependency-audit:
    name: SAST, Secret & Dependency Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Production Dependency Audit (npm audit)
        run: npm audit --omit=dev

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy Vulnerability & Secret Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH'

      - name: Semgrep Static Application Security Testing (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/javascript
            p/react
            p/nodejsscan

  dast-and-regression:
    name: Dynamic Security Testing (DAST) & Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Application
        run: npm run build

      - name: Start Local Application Server
        env:
          ENABLE_TEST_HELPERS: 'true'
        run: |
          node server/index.js &
          echo "Waiting for server to become healthy..."
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/ | grep -q "200"; then
              echo "Local server is up and healthy on http://127.0.0.1:3000"
              break
            fi
            sleep 1
          done

      - name: Execute OWASP ZAP Baseline DAST Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://127.0.0.1:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false

      - name: Upload OWASP ZAP Scan Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-dast-report
          path: zap-*.html

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Multi-Instance Distributed Architecture Test
        run: node scripts/test-multi-instance.js

      - name: Playwright E2E Security Regression Suite
        env:
          ENABLE_TEST_HELPERS: 'true'
        run: npx playwright test e2e/admin-auth-security.spec.js
